name: build-and-push-bsync-aws
on:
  push:
    branches:
      - main
      - msi/pds-otel

env:
  REGISTRY: ${{ secrets.AWS_ECR_REGISTRY_USEAST2_PACKAGES_REGISTRY }}
  USERNAME: ${{ secrets.AWS_ECR_REGISTRY_USEAST2_PACKAGES_USERNAME }}
  PASSWORD: ${{ secrets.AWS_ECR_REGISTRY_USEAST2_PACKAGES_PASSWORD }}
  IMAGE_NAME: bsync

jobs:
  bsync-container-aws:
    if: github.repository == 'bluesky-social/atproto'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME}}
          password: ${{ env.PASSWORD }}

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=long

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          file: ./services/bsync/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
